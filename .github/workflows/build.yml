name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送以 v 开头的标签时触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy pydicom opencv-python scipy pynetdicom PyQt5

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=batman.ico XAReviewer_4.8.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAReviewer-Windows
          path: dist/*.exe

  build-macos:
    name: macOS ${{ matrix.name }} (dmg)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4)：原生 arm64
          - runner: macos-latest
            name: AppleSilicon
            arch: arm64
          # Intel 芯片 Mac：原生 x86_64（修复"双击无反应"）
          - runner: macos-15-intel
            name: Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12 → scipy>=1.16（旧工具链编译的 Fortran 扩展在新版 macOS
          # dyld 严格校验下无法加载；1.15.x 仅支持到 Python 3.10）
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy pydicom opencv-python scipy pynetdicom PyQt5

      - name: Generate icon.icns from batman.ico
        run: |
          pip install pillow
          python3 scripts/make_icns.py batman.ico icon.icns

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --windowed --name XAReviewer --icon=icon.icns XAReviewer_4.8.py
          ls -la dist/

      - name: Verify binary architecture (防止架构打错)
        run: |
          BIN=dist/XAReviewer.app/Contents/MacOS/XAReviewer
          QT_LIB=dist/XAReviewer.app/Contents/Frameworks/PyQt5/Qt5/lib/QtCore.framework/Versions/5/QtCore
          echo "主程序: $(file -b "$BIN")"
          echo "QtCore:  $(file -b "$QT_LIB")"
          # 主程序与 Qt 库架构必须一致，且必须是本次 matrix 目标架构
          file -b "$BIN" | grep -q "${{ matrix.arch }}"
          file -b "$QT_LIB" | grep -q "${{ matrix.arch }}"

      # 修补 Mach-O 零填充段 offset（scipy/opencv 的旧工具链二进制
      # 在 macOS 26.2+ 上被 dyld 拒绝加载，报错：
      # "zero-fill section type, but offset field is not zero"）
      # 必须在 codesign 之前执行，修补后重新签名。
      - name: Patch zero-fill section offsets (macOS 26+ dyld 兼容)
        run: python3 scripts/patch_zerofill.py dist/XAReviewer.app

      - name: Ad-hoc codesign (避免"已损坏"提示)
        run: |
          codesign --force --deep --sign - dist/XAReviewer.app
          codesign --verify --deep dist/XAReviewer.app

      # 冒烟测试放在签名之后：验证的就是最终交付的二进制
      - name: Smoke test (offscreen 启动 15 秒，验证依赖打包完整)
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/XAReviewer.app/Contents/MacOS/XAReviewer &
          APP_PID=$!
          sleep 15
          if kill -0 $APP_PID 2>/dev/null; then
            echo "App launched and stayed running - bundling OK"
            kill $APP_PID 2>/dev/null || true
            sleep 2
            kill -9 $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
          else
            wait $APP_PID; rc=$?
            echo "App exited early with code $rc"
            exit 1
          fi

      - name: Create DMG
        run: |
          set -euxo pipefail
          rm -rf dmg-staging && mkdir -p dmg-staging
          cp -R dist/XAReviewer.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "XAReviewer-${{ matrix.name }}" \
            -srcfolder dmg-staging \
            -ov -format UDZO -fs "HFS+J" \
            "XAReviewer-macOS-${{ matrix.name }}.dmg"
          # CI 内校验镜像可挂载，杜绝坏镜像发布
          hdiutil verify "XAReviewer-macOS-${{ matrix.name }}.dmg"
          hdiutil imageinfo "XAReviewer-macOS-${{ matrix.name }}.dmg" | grep -E "Format:|Filesystem Name:"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAReviewer-macOS-${{ matrix.name }}
          path: XAReviewer-macOS-${{ matrix.name }}.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # 先以 draft 创建、上传全部资产后再发布（避免已发布 Release 无法追加资产）
      - name: Create draft release and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WIN=$(find dist -name '*.exe' | head -1)
          MAC_ARM=$(find dist -name '*AppleSilicon*.dmg' | head -1)
          MAC_INTEL=$(find dist -name '*Intel*.dmg' | head -1)
          [ -n "$MAC_ARM" ] || { echo "ERROR: Apple Silicon dmg missing"; exit 1; }
          [ -n "$MAC_INTEL" ] || { echo "ERROR: Intel dmg missing"; exit 1; }
          {
            echo "XAReviewer $TAG — Python (PyQt5) 版"
            echo ""
            echo "- Windows x64: \`XAReviewer_4.8.exe\`（单文件，双击即用）"
            echo "- macOS (Apple Silicon, M1/M2/M3/M4): \`XAReviewer-macOS-AppleSilicon.dmg\`"
            echo "- macOS (Intel 芯片): \`XAReviewer-macOS-Intel.dmg\`"
            echo ""
            echo "## 如何选择 macOS 版本"
            echo "点击左上角苹果菜单 →「关于本机」："
            echo "- 芯片显示 **Apple M1/M2/M3/M4** → 下载 \`AppleSilicon\` 版"
            echo "- 处理器显示 **Intel Core ...** → 下载 \`Intel\` 版"
            echo ""
            echo "下载错误的架构会导致双击无反应。"
            echo ""
            echo "## macOS 首次打开"
            echo "App 为 ad-hoc 签名（未做 Apple 公证）。首次打开若提示\"已损坏\"或\"无法验证开发者\"："
            echo "右键 App → 打开 → 再点\"打开\"；或执行："
            echo '```bash'
            echo 'xattr -cr /Applications/XAReviewer.app'
            echo '```'
            echo ""
            echo "## SHA256"
            echo '```'
            sha256sum "$WIN" "$MAC_ARM" "$MAC_INTEL"
            echo '```'
          } > NOTES.md
          gh release create "$TAG" "$WIN" "$MAC_ARM" "$MAC_INTEL" \
            --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "XAReviewer $TAG" \
            --notes-file NOTES.md
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
